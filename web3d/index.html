<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111a20">
  <title>Life Simulator 3D</title>
</head>
<body>
  <div id="game"></div>
  <div class="topbar">
    <div class="brand">LIFE <b>SIMULATOR</b><small>3D CITY · MOBILE PROTOTYPE</small></div>
    <div class="money" id="money">$ 1 250</div>
  </div>
  <div class="needs" id="needs">
    <div><span>❤ ЗДОРОВЬЕ</span><b id="health-t">100</b><i><em id="health"></em></i></div>
    <div><span>⚡ ЭНЕРГИЯ</span><b id="energy-t">100</b><i><em id="energy"></em></i></div>
    <div><span>🍔 СЫТОСТЬ</span><b id="hunger-t">100</b><i><em id="hunger"></em></i></div>
  </div>
  <div class="hint" id="hint">Исследуй город · Управление: слева движение, справа обзор</div>
  <div class="controls">
    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    <div class="look-label">ПРОВЕДИ ДЛЯ ОБЗОРА</div>
  </div>
  <button class="action" id="action">ВЗАИМОДЕЙСТВИЕ</button>
  <div class="toast" id="toast"></div>
  <script>
    // Remove the previous pixel-game PWA worker/cache so it cannot keep serving the old app.
    (async () => {
      if (!('serviceWorker' in navigator)) return;
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const hadOldWorker = registrations.length > 0;
        await Promise.all(registrations.map((registration) => registration.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        if (hadOldWorker && !sessionStorage.getItem('lifesim-clean-reloaded')) {
          sessionStorage.setItem('lifesim-clean-reloaded', '1');
          location.reload();
        }
      } catch (error) {
        console.warn('[Life Simulator] Old offline cache cleanup skipped', error);
      }
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
